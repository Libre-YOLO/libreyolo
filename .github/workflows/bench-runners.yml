name: Bench runners (throwaway)

# A/B of GitHub-hosted vs Blacksmith runners on the exact PR-gate command.
# Fires only on its own branch, never on dev or via PR. workflow_dispatch is
# useless here because the default branch (release) does not carry this file.
# Delete once the runner choice is settled.

on:
  push:
    branches: [ci/speed-up-unit-tests]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bench:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: "github / ubuntu (baseline)"
            runner: ubuntu-latest
          - label: "blacksmith / ubuntu 4vcpu"
            runner: blacksmith-4vcpu-ubuntu-2404
          - label: "github / windows (baseline)"
            runner: windows-latest
          - label: "blacksmith / windows 4vcpu"
            runner: blacksmith-4vcpu-windows-2025
          - label: "github / macos (baseline)"
            runner: macos-latest
          - label: "blacksmith / macos 6vcpu M4"
            runner: blacksmith-6vcpu-macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - uses: astral-sh/setup-uv@v4

      - name: Create virtual environment
        run: uv venv --python 3.10

      - name: Install dependencies
        run: uv pip install --no-sources --torch-backend cpu --group dev -e ".[rfdetr,onnx,clip]"

      - name: Machine facts
        run: |
          uv run --no-sync python -c "import os, platform, torch; print('machine :', platform.machine(), platform.system()); print('cpus    :', os.cpu_count()); print('torch   :', torch.__version__); print('threads :', torch.get_num_threads()); print('mps     :', torch.backends.mps.is_available())"

      - name: Run PR gate tests
        env:
          LIBREYOLO_PR_GATE: "1"
        run: uv run --no-sync pytest tests/unit -m "unit and not external_data and not network" --durations=25
