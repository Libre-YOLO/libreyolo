# SECURITY: do not add `pull_request` to this workflow. The e2e job uses
# Modal credentials and must not execute arbitrary code from fork PRs.

name: E2E nightly (dev)

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Run regardless of SHA cache"
        type: boolean
        default: false

concurrency:
  group: e2e-nightly-dev-modal-cache
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  guard:
    name: Resolve stale dev target
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.diff.outputs.should_run }}
      target_sha: ${{ steps.resolve.outputs.target_sha }}
      cache_key: ${{ steps.resolve.outputs.cache_key }}
      cache_hit: ${{ steps.cache-target.outputs.cache-hit }}
    steps:
      - id: resolve
        name: Resolve current dev SHA
        run: |
          set -euo pipefail
          TARGET_SHA=$(git ls-remote https://github.com/LibreYOLO/libreyolo refs/heads/dev | cut -f1)
          # The cache key carries an ISO week so a frozen target is still
          # retested once a week. A SHA-only key means a quiet dev branch is
          # never re-run, and the environment underneath it (Modal image,
          # published weights, transitive deps) drifts untested.
          WINDOW=$(date -u +%G-W%V)
          echo "target_sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"
          echo "window=$WINDOW" >> "$GITHUB_OUTPUT"
          echo "cache_key=last-tested-nightly-dev-$TARGET_SHA-$WINDOW" >> "$GITHUB_OUTPUT"
          echo "Resolved: dev=$TARGET_SHA window=$WINDOW"

      # restore, not cache: this job never creates the marker file, so the
      # save-on-post of actions/cache would warn every run and could claim the
      # key with nothing in it.
      - id: cache-target
        uses: actions/cache/restore@v4
        with:
          path: .last-dev
          key: ${{ steps.resolve.outputs.cache_key }}

      - id: diff
        name: Decide whether dev needs testing
        env:
          FORCE: ${{ inputs.force }}
          HIT_TARGET: ${{ steps.cache-target.outputs.cache-hit }}
          TARGET_SHA: ${{ steps.resolve.outputs.target_sha }}
          WINDOW: ${{ steps.resolve.outputs.window }}
        run: |
          set -euo pipefail
          if [ "${FORCE:-false}" = "true" ]; then
            SHOULD_RUN=true
            REASON="forced by workflow_dispatch input"
          elif [ "${HIT_TARGET:-}" = "true" ]; then
            SHOULD_RUN=false
            REASON="dev@${TARGET_SHA} already passed a nightly in week ${WINDOW}"
          else
            SHOULD_RUN=true
            REASON="no passing nightly recorded for dev@${TARGET_SHA} in week ${WINDOW}"
          fi
          echo "should_run=$SHOULD_RUN" >> "$GITHUB_OUTPUT"
          echo "Should run dev: $SHOULD_RUN ($REASON)"

          # Every run says, in its own summary, which SHA it covers and whether
          # it actually tested it. A skipped run is green; without this line it
          # is indistinguishable from a pass in the run list.
          if [ "$SHOULD_RUN" = "true" ]; then
            VERDICT="RUNNING the GPU suite"
          else
            VERDICT="SKIPPED, no GPU suite ran in this run"
          fi
          {
            echo "### Nightly guard: $VERDICT"
            echo
            echo "- Target: \`dev@${TARGET_SHA}\`"
            echo "- Week window: \`${WINDOW}\`"
            echo "- Reason: ${REASON}"
            echo
            if [ "$SHOULD_RUN" != "true" ]; then
              echo "This run did **not** execute the GPU suite. The green tick"
              echo "means the guard resolved cleanly, not that this commit was"
              echo "tested in this run. The pass it is standing on is an earlier"
              echo "run against the same SHA."
              echo
              echo "To test it anyway: re-dispatch with \`force=true\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  skipped:
    name: Skipped (dev already tested)
    needs: guard
    if: needs.guard.outputs.should_run == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Explain the skip
        run: |
          echo "No GPU suite ran. dev@${{ needs.guard.outputs.target_sha }} already"
          echo "passed a nightly this week. Re-dispatch with force=true to retest."

  e2e:
    name: e2e (dev)
    needs: guard
    if: needs.guard.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 195
    steps:
      # The resolved SHA, not the branch: dev can move between the guard
      # resolving it and this checkout, which would run the harness from one
      # commit against a different one.
      - name: Checkout the resolved dev SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.guard.outputs.target_sha }}

      - uses: astral-sh/setup-uv@v4

      - name: Run e2e on Modal
        shell: bash
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          # Optional: lifts the Modal container off anonymous Hub rate limits.
          # Unset is fine, the run stays anonymous as before.
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -uo pipefail
          uvx modal run tools/ci/modal_nightly.py \
            --ref "${{ needs.guard.outputs.target_sha }}" \
            --target test_nightly 2>&1 | tee modal-nightly.log
          modal_rc=${PIPESTATUS[0]}

          set +e
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          log = Path("modal-nightly.log").read_text(encoding="utf-8", errors="replace")
          matches = re.findall(r"MODAL_NIGHTLY_RESULT (\{.*\})", log)
          result = json.loads(matches[-1]) if matches else {
              "status": "unknown",
              "error": "MODAL_NIGHTLY_RESULT not found in log",
          }
          Path("modal-nightly-result.json").write_text(
              json.dumps(result, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          total_s = float(result.get("total_s", 0) or 0)
          minutes = total_s / 60 if total_s else 0
          cost = result.get("estimated_gpu_cost_usd")
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with Path(summary).open("a", encoding="utf-8") as f:
                  f.write("### Modal nightly result\n\n")
                  f.write(f"- Status: `{result.get('status', 'unknown')}`\n")
                  f.write(f"- Ref: `{result.get('ref', '${{ needs.guard.outputs.target_sha }}')}`\n")
                  f.write(f"- Target: `{result.get('target', 'test_nightly')}`\n")
                  f.write(f"- GPU: `{result.get('gpu', 'unknown')}`\n")
                  if total_s:
                      f.write(f"- Runtime: `{total_s:.2f}s` (`{minutes:.2f} min`)\n")
                  if cost is not None:
                      f.write(f"- Estimated GPU cost: `${float(cost):.4f}`\n")
                      f.write("- Cost note: GPU runtime estimate only; Modal billing is authoritative for exact total cost.\n")
                  if "error" in result:
                      f.write(f"- Error: `{result['error']}`\n")
                  f.write("\n")

          raise SystemExit(0 if result.get("status") == "passed" else 2)
          PY
          parse_rc=$?
          set -e

          if [ "$modal_rc" -ne 0 ]; then
            exit "$modal_rc"
          fi
          exit "$parse_rc"

      - name: Upload Modal nightly result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modal-nightly-${{ needs.guard.outputs.target_sha }}
          path: |
            modal-nightly.log
            modal-nightly-result.json

      - name: Mark dev as tested
        if: success()
        run: echo "ok ${{ github.run_id }}" > .last-dev

      - name: Save tested-SHA cache
        if: success() && needs.guard.outputs.cache_hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .last-dev
          key: ${{ needs.guard.outputs.cache_key }}
