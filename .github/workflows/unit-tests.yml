name: Unit tests

on:
  push:
    branches: [dev, release]
  pull_request:
    branches: [dev, release]
  workflow_dispatch:

permissions:
  contents: read

# Supersede in-flight runs for a PR when new commits land, but never cancel a
# push to dev: each dev commit's result is the signal used to bisect a break.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit-tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The `distributed` (multi-rank gloo) tests run on Linux only. They
          # cover distributed-training math, which is platform-independent,
          # and dist.init_process_group(backend="gloo") costs ~105s per test on
          # the macOS runner: a bare 2-rank scalar all-reduce with no model in
          # it takes 109s there against 3.9s on Linux. Those 12 tests were 71%
          # of the whole macOS run. The spawn-plumbing tests stay on every OS.
          - os: ubuntu-latest
            python-version: "3.10"
            markers: "unit and not external_data and not network"
          - os: macos-latest
            python-version: "3.10"
            markers: "unit and not external_data and not network and not distributed"
          - os: windows-latest
            python-version: "3.10"
            markers: "unit and not external_data and not network and not distributed"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@v4

      - name: Create virtual environment
        run: uv venv --python ${{ matrix.python-version }}

      - name: Install dependencies
        # The onnx extra keeps the ONNX-dependent unit tests (raw export
        # contract, picodet/classification round-trips) from silently
        # skipping in this gate — they importorskip onnx/onnxruntime.
        # The clip extra (ftfy + regex) keeps the LibreCLIP tokenizer tests
        # from erroring on a missing optional tokenizer dependency.
        run: uv pip install --no-sources --torch-backend cpu --group dev -e ".[rfdetr,onnx,clip]"

      - name: Run PR gate tests
        env:
          LIBREYOLO_PR_GATE: "1"
        run: uv run --no-sync pytest tests/unit -m "${{ matrix.markers }}" --durations=25
